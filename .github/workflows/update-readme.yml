name: Update README

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests deep-translator==1.11.4

      - name: Verificar archivos necesarios
        run: |
          echo "Archivos encontrados:"
          find . -maxdepth 3 -type f | sort

          test -f README.md || {
            echo "::error::No se encontró README.md"
            exit 1
          }

          test -f scripts/update_readme.py || {
            echo "::error::No se encontró scripts/update_readme.py"
            exit 1
          }

      - name: Actualizar README
        env:
          README_LANGUAGES: all
        run: python update_readme.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- README.md; then
            echo "No hay cambios en README.md."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add README.md
            git commit -m "docs: update multilingual fact 🐾"
            git push
          fi
